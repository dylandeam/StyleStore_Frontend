<div class="confirm-container">
  <div class="confirm-card">
    <div class="card-icon" [class.success]="isSuccess()" [class.error]="!isSuccess() && !isLoading()">
      @if (isLoading()) {
        <div class="spinner-large"></div>
      } @else if (isSuccess()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      }
    </div>

    <h2>Confirmación de Contraseña</h2>

    @if (isLoading()) {
      <p class="status-text">Validando token de seguridad...</p>
    } @else {
      <p class="status-text" [class.text-success]="isSuccess()" [class.text-danger]="!isSuccess()">
        {{ message() }}
      </p>

      <div class="actions">
        @if (isSuccess()) {
          <a routerLink="/auth/login" class="btn btn-primary">Iniciar Sesión Ahora</a>
        } @else {
          <a routerLink="/auth/login" class="btn btn-secondary">Volver al Inicio</a>
        }
      </div>
    }
  </div>
</div>
